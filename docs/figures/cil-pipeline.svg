<svg xmlns="http://www.w3.org/2000/svg" width="620" height="245" viewBox="0 0 620 245" role="img" aria-labelledby="title desc">
  <title id="title">CIL 주행 파이프라인</title>
  <desc id="desc">중앙 카메라 영상과 현재 속도에서 CIL이 특징을 추출한다. MGeo 경로의 진행 명령이 출력 분기를 선택하고, 선택한 분기가 조향, 가속, 제동을 예측한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5 0 9Z" fill="#415152"/>
    </marker>
    <marker id="command-arrow" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5 0 9Z" fill="#176358"/>
    </marker>
  </defs>
  <rect width="620" height="245" fill="#ffffff"/>
  <path d="M26 49H594" stroke="#c6cecd" stroke-width="1.5"/>
  <g fill="#edf3f1" stroke="#78908c" stroke-width="1.5">
    <rect x="226" y="67" width="176" height="65"/>
    <rect x="226" y="165" width="176" height="54"/>
  </g>
  <g fill="none" stroke="#415152" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160 100H217"/>
    <path d="M314 138V157"/>
    <path d="M411 192H449"/>
  </g>
  <path d="M160 192H217" fill="none" stroke="#176358" stroke-width="2.5" marker-end="url(#command-arrow)"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" fill="#172526">
    <g font-size="21" font-weight="700" fill="#465958">
      <text x="27" y="36">입력</text>
      <text x="226" y="36">모델</text>
      <text x="460" y="36">출력</text>
    </g>
    <g font-size="25" font-weight="700">
      <text x="27" y="94">중앙 영상</text>
      <text x="314" y="93" text-anchor="middle">CIL</text>
      <text x="314" y="200" text-anchor="middle">명령별 분기</text>
      <text x="460" y="185">조향</text>
      <text x="460" y="214">가속·제동</text>
      <text x="27" y="186" fill="#176358">진행 명령</text>
    </g>
    <g font-size="21" fill="#465958">
      <text x="27" y="123">현재 속도</text>
      <text x="314" y="118" text-anchor="middle">영상·속도 특징</text>
      <text x="27" y="214">MGeo 경로</text>
    </g>
  </g>
</svg>
