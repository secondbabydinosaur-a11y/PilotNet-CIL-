<svg xmlns="http://www.w3.org/2000/svg" width="620" height="206" viewBox="0 0 620 206" role="img" aria-labelledby="title desc">
  <title id="title">PilotNet 주행 파이프라인</title>
  <desc id="desc">중앙 카메라 영상 한 장을 PilotNet CNN에 넣어 곡률을 예측한다. 예측 곡률을 MORAI 조향으로 변환한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5 0 9Z" fill="#415152"/>
    </marker>
  </defs>
  <rect width="620" height="206" fill="#ffffff"/>
  <path d="M26 49H594" stroke="#c6cecd" stroke-width="1.5"/>
  <rect x="226" y="67" width="176" height="65" fill="#edf3f1" stroke="#78908c" stroke-width="1.5"/>
  <g fill="none" stroke="#415152" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160 100H217"/>
    <path d="M411 100H449"/>
    <path d="M463 123V149"/>
  </g>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" fill="#172526">
    <g font-size="21" font-weight="700" fill="#465958">
      <text x="27" y="36">입력</text>
      <text x="226" y="36">모델</text>
      <text x="460" y="36">출력</text>
    </g>
    <g font-size="25" font-weight="700">
      <text x="27" y="94">중앙 카메라</text>
      <text x="314" y="109" text-anchor="middle">PilotNet CNN</text>
      <text x="460" y="106">곡률</text>
      <text x="460" y="179">MORAI 조향</text>
    </g>
    <g font-size="21" fill="#465958">
      <text x="27" y="123">영상 1장</text>
      <text x="515" y="106">(1/m)</text>
    </g>
  </g>
</svg>
